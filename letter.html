<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بۆ محمد ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe6ee, #fff5f8);
        font-family: Arial, sans-serif;
        direction: rtl;
        text-align: center;
    }

    .letter {
        width: 85%;
        max-width: 500px;
        padding: 35px 25px;
        background: rgba(255,255,255,0.9);
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        color: #4a2732;
        line-height: 2.2;
        font-size: 20px;
    }

    h1 {
        color: #d94f70;
        margin-bottom: 25px;
    }

    .heart {
        font-size: 45px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        50% {
            transform: scale(1.2);
        }
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 20px;
        background: #d94f70;
        color: white;
        font-size: 18px;
    }
</style>
</head>

<body>

<div class="letter">

    <div class="heart">❤️</div>

    <h1>محمد</h1>

    <p>
        بۆ بوونت لە ژیانمدا ❤️<br>
        ڕۆژی لە دایک بوونت پیرۆز بێ
    </p>

    <p>
        پیرۆز بێ
    </p>

    <p>
        یەکەمجار ئەوەیە تۆ بخوازە<br>
        کلیک بکە ❤️
    </p>

    <button onclick="alert('ڕۆژی لە دایک بوونت پیرۆز بێ محمد ❤️')">
        کلیک بکە ❤️
    </button>

</div>

</body>
</html>
